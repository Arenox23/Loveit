<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Holi My Baby Girl ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  background: black;
  transition: background 3s ease;
}

.container {
  text-align: center;
  z-index: 2;
}

h1 {
  font-size: 42px;
  margin: 10px 0;
  background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
  background-size: 400%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 5s linear infinite;
  opacity: 0;
  transform: scale(0.6);
  transition: 1s ease;
}

@keyframes rainbow {
  0% { background-position: 0% }
  100% { background-position: 400% }
}

p {
  font-size: 20px;
  color: white;
  opacity: 0;
  transition: opacity 2s ease;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg,#ff4d6d,#ff9800,#9c27b0);
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
}

.color {
  position: absolute;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  animation: explode 1.5s ease-out forwards;
}

@keyframes explode {
  from {
    transform: scale(0);
    opacity: 1;
  }
  to {
    transform: translate(var(--x), var(--y)) scale(2);
    opacity: 0;
  }
}

.show {
  opacity: 1 !important;
  transform: scale(1) !important;
}

#finalMessage {
  margin-top: 15px;
  font-size: 22px;
  font-weight: bold;
  color: white;
  opacity: 0;
  transition: opacity 2s ease;
}
</style>
</head>

<body onclick="extraSplash(event)">

<div class="container">
  <h1 id="title">Happy Holi My Baby Girl ❤️</h1>
  <p id="msg">You are the most beautiful color in my life 🌈</p>
  <button onclick="celebrate(event)">Celebrate 🎨</button>
  <div id="finalMessage">Forever my favorite person 💖</div>
</div>

<audio id="music" src="song.mp3"></audio>

<script>

let activated = false;

function celebrate(e) {
  e.stopPropagation();

  activated = true;

  document.getElementById("music").play();

  document.getElementById("title").classList.add("show");
  document.getElementById("msg").classList.add("show");

  document.body.style.background = "linear-gradient(45deg,#ff4d6d,#ff9800,#9c27b0,#00e5ff,#4caf50)";

  createBurst(window.innerWidth/2, window.innerHeight/2);

  setTimeout(() => {
    document.getElementById("finalMessage").style.opacity = 1;
  }, 5000);
}

function createBurst(x, y) {
  for (let i = 0; i < 100; i++) {
    let color = document.createElement("div");
    color.className = "color";

    let colors = ["#ff4d6d","#ff9800","#9c27b0","#00e5ff","#4caf50","#ffff00"];
    color.style.background = colors[Math.floor(Math.random()*colors.length)];

    color.style.left = x + "px";
    color.style.top = y + "px";

    let moveX = (Math.random() - 0.5) * 700 + "px";
    let moveY = (Math.random() - 0.5) * 700 + "px";

    color.style.setProperty('--x', moveX);
    color.style.setProperty('--y', moveY);

    document.body.appendChild(color);

    setTimeout(() => { color.remove(); }, 1500);
  }
}

function extraSplash(e) {
  if (activated) {
    createBurst(e.clientX, e.clientY);
  }
}

</script>

</body>
</html>
